[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-deerflow-backend"
version = "0.1.0"
description = "A staged, from-scratch DeerFlow backend learning project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3",
    "langchain-core",
    "langchain-deepseek>=1.0.1",
    "langchain-openai>=1.2.1",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

