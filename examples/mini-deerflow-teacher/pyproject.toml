[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-deerflow-teacher"
version = "0.1.0"
description = "A guided, from-scratch DeerFlow backend learning project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "langchain>=1.3",
    "langchain-core",
    "langchain-deepseek>=1.0.1",
    "langchain-openai>=1.2.1",
    "langgraph>=1.2.9,<1.3",
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=9.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["harness", "."]

[tool.setuptools.packages.find]
where = ["harness"]
